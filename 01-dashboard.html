<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintWatch - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --blue: #3b82f6; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; }
        
        /* زر القائمة للهاتف */
        .menu-header { display: none; background: var(--surface); padding: 15px; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-toggle { background: var(--blue); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        /* القائمة الجانبية */
        .sidebar { width: 240px; background: var(--surface); height: 100vh; padding: 20px; position: fixed; right: 0; top: 0; transition: 0.3s; z-index: 1000; border-left: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; color: var(--text); text-decoration: none; padding: 12px; margin-bottom: 8px; border-radius: 10px; transition: 0.2s; }
        .nav-item i { margin-left: 10px; width: 20px; text-align: center; }
        .nav-item:hover, .active { background: var(--blue); color: white; }
        
        /* المحتوى */
        .main-content { margin-right: 240px; padding: 25px; width: calc(100% - 240px); transition: 0.3s; }

        /* تعديلات الهاتف */
        @media (max-width: 768px) {
            .menu-header { display: flex; position: sticky; top: 0; z-index: 1100; }
            .sidebar { right: -240px; height: 100%; pt: 60px; }
            .sidebar.show { right: 0; }
            .main-content { margin-right: 0; width: 100%; padding: 15px; }
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
            .sidebar-overlay.show { display: block; }
        }
    </style>
</head>
<body>

    <div class="menu-header">
        <h3 style="margin:0; color: var(--blue);">PrintWatch</h3>
        <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i> القائمة</button>
    </div>

    <div class="sidebar-overlay" onclick="toggleMenu()"></div>

    <div class="sidebar">
        <h2 style="color: var(--blue); margin-bottom: 30px; text-align: center;">PrintWatch</h2>
        <a href="01-dashboard.html" class="nav-item active"><i class="fas fa-chart-line"></i> الرئيسية</a>
        <a href="products.html" class="nav-item"><i class="fas fa-box-open"></i> إدارة المنتجات</a>
        <a href="#" class="nav-item"><i class="fas fa-users"></i> العملاء</a>
        <a href="#" class="nav-item"><i class="fas fa-bell"></i> التنبيهات</a>
        <a href="#" class="nav-item"><i class="fas fa-cog"></i> الإعدادات</a>
    </div>

    <div class="main-content">
        <h1>لوحة التحكم</h1>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div style="background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
                <p style="color: #94a3b8; margin: 0;">الطابعات المتصلة</p>
                <h2 style="margin: 10px 0; color: #10b981;">12 طابعة</h2>
            </div>
            <div style="background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
                <p style="color: #94a3b8; margin: 0;">تنبيهات الحبر</p>
                <h2 style="margin: 10px 0; color: #ef4444;">3 تنبيهات</h2>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.querySelector('.sidebar').classList.toggle('show');
            document.querySelector('.sidebar-overlay').classList.toggle('show');
        }
    </script>
</body>
</html>

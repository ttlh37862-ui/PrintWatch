<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintWatch - لوحة التحكم</title>
    <!-- استدعاء المكتبات الضرورية للرسوم البيانية والأيقونات -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --blue: #3b82f6; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; overflow-x: hidden; }

        /* القائمة الجانبية */
        .sidebar { width: 240px; background: var(--surface); height: 100vh; position: fixed; right: 0; top: 0; transition: 0.3s; z-index: 1000; border-left: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .nav-item { display: flex; align-items: center; color: var(--text); text-decoration: none; padding: 15px 20px; transition: 0.2s; }
        .nav-item:hover, .active { background: rgba(59, 130, 246, 0.1); color: var(--blue); border-right: 4px solid var(--blue); }
        .nav-item i { margin-left: 10px; }

        /* المحتوى الرئيسي */
        .main-content { margin-right: 240px; padding: 20px; transition: 0.3s; }
        .card { background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }

        /* زر القائمة للهاتف (يظهر فقط في الشاشات الصغيرة) */
        .mobile-header { display: none; background: var(--surface); padding: 10px 20px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-btn { background: var(--blue); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }

        /* تعديلات الهاتف */
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { right: -240px; }
            .sidebar.show { right: 0; }
            .main-content { margin-right: 0; padding: 15px; }
            .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
            .overlay.show { display: block; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <h3 style="margin:0; color: var(--blue)">PrintWatch</h3>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i> القائمة</button>
    </div>

    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar">
        <h2 style="text-align: center; color: var(--blue)">PrintWatch</h2>
        <a href="01-dashboard.html" class="nav-item active"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="products.html" class="nav-item"><i class="fas fa-box"></i> المنتجات</a>
        <a href="#" class="nav-item"><i class="fas fa-tint"></i> إدارة الحبر</a>
        <a href="#" class="nav-item"><i class="fas fa-users"></i> العملاء</a>
    </div>

    <div class="main-content">
        <h1>لوحة التحكم</h1>
        
        <!-- ملخص سريع -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <div class="card" style="text-align: center;">
                <p style="color: #94a3b8; margin:0;">طابعات نشطة</p>
                <h2 style="color: #10b981; margin: 10px 0;">12</h2>
            </div>
            <div class="card" style="text-align: center;">
                <p style="color: #94a3b8; margin:0;">تنبيهات</p>
                <h2 style="color: #ef4444; margin: 10px 0;">3</h2>
            </div>
        </div>

        <!-- الرسم البياني -->
        <div class="card">
            <h3>معدل استهلاك الورق أسبوعياً</h3>
            <canvas id="myChart" style="max-height: 250px;"></canvas>
        </div>
    </div>

    <script>
        // كود تشغيل القائمة في الهاتف
        function toggleMenu() {
            document.querySelector('.sidebar').classList.toggle('show');
            document.querySelector('.overlay').classList.toggle('show');
        }

        // كود الرسم البياني ليعود كما كان
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'],
                datasets: [{
                    label: 'عدد الأوراق',
                    data: [1200, 1900, 1500, 2500, 2200],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { 
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } } }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintWatch - لوحة التحكم</title>
    <!-- استعادة الروابط الأصلية التي كانت في ملفك -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* كود الإصلاح للهاتف */
        @media (max-width: 768px) {
            .sidebar { position: fixed; right: -260px; transition: 0.3s; z-index: 9999; height: 100vh !important; }
            .sidebar.active { right: 0; }
            .main-content { margin-right: 0 !important; width: 100% !important; padding: 10px !important; }
            .menu-toggle-btn { display: block !important; position: fixed; top: 10px; left: 10px; z-index: 10000; background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 5px; }
        }
        .menu-toggle-btn { display: none; }
        
        /* هنا تضع كود التصميم الأصلي الخاص بك (الذي كان في صورتك الأولى) */
        /* سأضع لك نسخة محسنة منه لتعمل فوراً */
        :root { --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; }
        .sidebar { width: 240px; background: var(--surface); height: 100vh; padding: 20px; position: fixed; right: 0; }
        .main-content { margin-right: 240px; padding: 20px; width: 100%; }
        .card { background: var(--surface); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!-- زر لإظهار القائمة في الهاتف -->
    <button class="menu-toggle-btn" onclick="document.querySelector('.sidebar').classList.toggle('active')">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar">
        <h2>PrintWatch</h2>
        <hr>
        <a href="01-dashboard.html" style="display:block; color:white; padding:10px; text-decoration:none;">الرئيسية</a>
        <a href="products.html" style="display:block; color:white; padding:10px; text-decoration:none;">إدارة المنتجات</a>
        <a href="#" style="display:block; color:white; padding:10px; text-decoration:none;">إدارة الحبر</a>
    </div>

    <div class="main-content">
        <div class="card">
            <h1>لوحة التحكم</h1>
            <p>مرحباً بك في نظام PrintWatch</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            <div class="card">
                <h3>طابعات نشطة</h3>
                <h2 style="color: #10b981;">12</h2>
            </div>
            <div class="card">
                <h3>تنبيهات الحبر</h3>
                <h2 style="color: #ef4444;">3</h2>
            </div>
        </div>
    </div>

</body>
</html>
